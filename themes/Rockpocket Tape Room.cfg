#
# Rockpocket Tape Room - skin 2b from the openness study.
#
# "State, not shape": amber on near-black, and the gesture says what it is
# doing in words - mode and rows per second, in a pill at the top. That
# readout is the study's floor for this skin; the spooling reels behind it
# need a drawing surface the skin engine does not offer.
#
# Visual only: identical engine, identical bindings, identical feel.
#
background color: 12100C
foreground color: FFC061
line selector start color: FF9C2B
line selector end color: FF9C2B
line selector text color: 12100C
selector type: bar (inverse)
statusbar: top
scrollbar: off
backdrop: -
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick degrees per detent: 11
stick overlay: on
stick overlay style: readout
stick dial lists: off
stick dial wps: off
