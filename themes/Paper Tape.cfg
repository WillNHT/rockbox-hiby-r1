#
# Paper Tape - skin 1c from the openness study, and the one to
# learn on.
#
# A permanent-looking control plate at the bottom of the screen: groove,
# travel ring, and a cap that actually moves with the thumb. Dragging
# anywhere still works identically - the plate is a home, not a fence.
#
# It is drawn while a gesture is live, not at rest; see the note in the
# summary about why a plate that is always there needs a hook Rockbox
# does not have.
#
# Visual only: identical engine, identical bindings, identical feel.
#
background color: F2EFE7
foreground color: 1B1D1F
line selector start color: C25B34
line selector end color: C25B34
line selector text color: F2EFE7
selector type: bar (inverse)
statusbar: top
scrollbar: right
backdrop: -
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: plate
stick dial wps: off
stick dial lists: off
