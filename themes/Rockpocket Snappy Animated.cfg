#
# Rockpocket Snappy Animated - Snappy V2, in motion.
#
# A fork of "Rockpocket Snappy V2", identical to it in palette, fonts,
# proportions and stick settings. The only difference is the now-playing
# screen, which moves.
#
# It exists to be looked at while it runs. A now-playing screen in this
# fork is redrawn several times a second for the first time - %an makes the
# skin engine treat a skin as live rather than waiting for the track to do
# something - and a full skin update is the backdrop, the album art and
# every bitmap rebuilt. That is exactly the workload that used to strobe.
# So this theme is also the test: if it is smooth, the display work
# (vsynced page flipping, the two-plane dirty tracking, and the stick
# overlay no longer asking the screen to repaint on its own account) is
# doing what it was supposed to. If it flickers, it is not.
#
# Like Snappy V2, it needs Snappy's icons on the card
# (icons/Snappy.bmp, icons/Snappy_viewer.bmp); those ship with Snappy and
# are not duplicated here. The skin, its bitmaps and the fonts are this
# theme's own.
#
# --- what moves ------------------------------------------------------
#
# * A bright segment runs clockwise around the album art, sixteen stops at
#   70 ms, and only while something is playing. The skin engine cannot
#   move a viewport, so a thing that travels is one viewport per stop with
#   %an choosing which one is enabled - the file is generated from
#   themes/gen_animated.py for that reason.
# * An accent rule under the title breathes, eight widths at 110 ms. It is
#   a gradient rather than a flat bar, which is the one place a skin can
#   ask for gradient_fillrect.
# * When paused, the two pause bars blink - the one state where nothing
#   else on the screen is moving.
# * The sample rate and the playlist position take turns in the same slot,
#   four seconds each, using the engine's own %t sublines.
# * The peak meter and the title marquee are Snappy's, and were already
#   the only two moving parts a skin could have before %an.
#
wps: /.rockbox/wps/SnappyAnimated.wps
sbs: /.rockbox/wps/SnappyAnimated.sbs
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
show icons: on
backdrop: -
ui viewport: -
filetype colours: -
statusbar: top
font: /.rockbox/fonts/44-GeistMono-SemiBold.fnt
#
# --- palette, from Monolith ------------------------------------------
#
# Unchanged from Snappy V2. The accent is what the chase and the pulse are
# drawn in, so changing the line selector colour here changes them too.
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
scrollbar: off
#
# --- the stick -------------------------------------------------------
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
