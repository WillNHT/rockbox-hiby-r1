#
# Snappy Canvas - a video demo: the cover moves.
#
# Snappy Animated, with the playing track's animated cover (a "canvas":
# <track>.canvas.mp4, canvas.mp4 or an animated cover.gif / cover.webp in
# the album folder) where the cover is, or its music video
# (<track>.video.mp4) when the WPS context menu says Show Music Video. The
# music video has no sound of its own: it follows the track. Without
# either, the skin is Snappy Animated without the sheen.
#
# It turns video on (Settings > Video), and it needs the video decoder,
# rockbox-hibyr1-video.zip, on the card. See docs/mods/video.md.
#
wps: /.rockbox/wps/SnappyCanvas.wps
sbs: /.rockbox/wps/SnappyCanvas.sbs
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
show icons: on
backdrop: -
ui viewport: -
filetype colours: -
statusbar: top
font: /.rockbox/fonts/44-GeistMono-SemiBold.fnt
#
# --- palette, from Monolith ------------------------------------------
#
# Unchanged from Snappy V2. The accent is what the chase and the pulse are
# drawn in, so changing the line selector colour here changes them too.
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
scrollbar: off
#
# --- the stick -------------------------------------------------------
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
#
# --- video -----------------------------------------------------------
video: on
video canvas: on
video music videos: on
