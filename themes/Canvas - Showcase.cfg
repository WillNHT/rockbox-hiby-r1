#
# Canvas - Showcase
#
# Everything the rendering work added, turned on at once, on the openness
# study's palette:
#
#   * vsynced page flipping, so the panel is never scanned out half drawn
#   * antialiased text blended in linear light, which is why glyphs keep
#     their weight on this dark ground instead of blooming
#   * the Canvas HUD: antialiased rings, a soft-shadowed cap, a readout
#     pill, all composited over a saved backdrop so nothing smears
#
# The effects that have no home in a theme - blur, drop shadows, dithered
# gradients, reflections, nine-slice, the easing curves - are on one screen
# of their own:
#
#     Settings > System > Debug > Canvas effects demo
#
# A .cfg can only set settings, so it can point at that screen but it
# cannot contain it. Press select or back to leave the demo.
#
foreground color: ECEAE6
background color: 101113
line selector text color: 101113
line selector start color: 8FD6B3
line selector end color: 8FD6B3
selector type: bar (color)
statusbar: top
scrollbar: right
scrollbar width: 5
show icons: on
font: /.rockbox/fonts/18-Manrope-Medium.fnt
backdrop: -
filetype colours: -
ui viewport: -
#
# Those three colours are not decoration. A .cfg theme can only set
# settings, so foreground, background and line selector are the whole
# channel a theme has to the overlay: the HUD reads them as its ink,
# ground and accent.
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: canvas
stick edge swipe: on
stick dial wps: on
stick dial lists: on
#
# The study's three motion profiles are not settings - scroll feel lives
# in /.rockbox/stick.cfg, which is global and yours - so they are written
# down rather than applied, in this engine's units. Coach pairs with the
# gentle end:
#
#   gentle    scrollPx 170   accelMaxQ8 384   sustainVmax 30
#   standard  scrollPx 140   accelMaxQ8 512   sustainVmax 45
#   fast      scrollPx 110   accelMaxQ8 768   sustainVmax 64
#
