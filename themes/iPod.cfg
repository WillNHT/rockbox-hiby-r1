#
# iPod - Monolith, with an iPod 5.5 for the now playing screen.
#
# Monolith's lists - no status bar, big rows, edge lights for the stick -
# with a now playing screen that is an iPod 5.5 seen from the front: the
# display window up top, the click wheel below it.
#
# The wheel is a picture and nothing is bound to it. The stick still owns
# the panel, and a wheel that looked live but was not would be worse than
# one that plainly is not.
#
# Visual only: identical engine, identical bindings, identical feel.
#
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
statusbar: off
scrollbar: off
backdrop: -
# Set explicitly. The skin's rows are sized for an 18 px face; inheriting
# whatever font the last theme left behind (Snappy leaves a 44 px one) puts
# the elapsed/remaining line through the scrubber underneath it.
font: /.rockbox/fonts/18-Manrope-Medium.fnt
wps: /.rockbox/wps/iPod.wps
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: off
stick dial lists: off
