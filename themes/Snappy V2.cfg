#
# Snappy V2 - Snappy, then Monolith, then the stick.
#
# The order is the point. Snappy lays down the structure: the status bar,
# the now-playing screen, the icons, the proportions. Monolith then takes
# the palette off it - near-black ground, warm off-white ink, a single
# acid-yellow selector - and strips the furniture the study called
# decoration. The stick's settings come last because they are input, not
# looks, and nothing above them has an opinion about them.
#
# It needs Snappy's icons on the card (icons/Snappy.bmp,
# icons/Snappy_viewer.bmp). Those ship with Snappy and are not duplicated
# here. The skin, the fonts and the bitmaps are this theme's own
# (wps/SnappyV2.*, fonts/*-GeistMono-SemiBold.fnt).
#
# --- from Snappy -----------------------------------------------------
#
# The skin, relaid. The prev/play/next badges, their touch band, the
# progress bar and its seek region are gone - under the stick none of
# those regions can fire, and they were holding 190 px of the screen. The
# album art takes that space (full width between the margins), and the
# peak meter, codec, bit rate and sample rate move into one band beneath
# it. Elapsed/total and the playlist position stay, as text.
wps: /.rockbox/wps/SnappyV2.wps
sbs: /.rockbox/wps/SnappyV2.sbs
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
show icons: on
backdrop: -
ui viewport: -
filetype colours: -
#
# The status bar stays on, and this is the one line not taken from
# Monolith. Monolith deletes the status bar because it has none of its
# own; Snappy's is a custom SBS carrying the clock, the battery, the
# volume and the lock indicator, and turning the bar off takes the SBS
# with it. Deleting a status bar that does not exist and deleting one that
# is half the theme are not the same instruction.
statusbar: top
#
# The font. Kode Mono - Snappy's own face - has no Vietnamese: Google
# publishes it with latin and latin-ext only, which covers the base
# letters and none of the tone marks, so anything with a hook, a dot below
# or a stacked accent came out as a box. Geist Mono is the nearest thing
# to it that has the full set - the same squared, geometric, flat-terminal
# mono - and these four sizes are rendered from GeistMono-SemiBold with
# convttf over U+0000..U+1FFF, which takes in Latin Extended Additional
# where Vietnamese actually lives. SIL OFL, like Kode Mono.
font: /.rockbox/fonts/44-GeistMono-SemiBold.fnt
#
# --- from Monolith ---------------------------------------------------
#
# The palette, and the furniture it removes. These override Snappy's warm
# orange ground; %Vs(invert) in the skin follows them, so the inverted
# blocks in the header invert against this ground rather than that one.
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
scrollbar: off
#
# --- the stick -------------------------------------------------------
#
# Four ways, full panel, and the edge light for the overlay - this screen
# is busy enough without a rose drawn over it. The dial is armed by a slow
# tap in the WPS, so the sectors and the volume dial share the screen.
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
