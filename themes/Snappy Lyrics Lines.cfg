#
# Snappy Lyrics Lines - a lyrics demo: two lines in Snappy Animated.
#
# Snappy Animated, with the band under the cover (peak meter, codec, bit
# rate) giving way to the lyrics while the track has them: the line being
# sung in the accent colour and the next one under it. Tracks without
# lyrics look exactly like Snappy Animated.
#
# See docs/mods/lyrics.md for where lyrics come from.
#
wps: /.rockbox/wps/SnappyLyricsLines.wps
sbs: /.rockbox/wps/SnappyLyricsLines.sbs
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
show icons: on
backdrop: -
ui viewport: -
filetype colours: -
statusbar: top
font: /.rockbox/fonts/44-GeistMono-SemiBold.fnt
#
# --- palette, from Monolith ------------------------------------------
#
# Unchanged from Snappy V2. The accent is what the chase and the pulse are
# drawn in, so changing the line selector colour here changes them too.
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
scrollbar: off
#
# --- the stick -------------------------------------------------------
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
