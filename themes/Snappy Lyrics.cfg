#
# Snappy Lyrics - a lyrics demo: the whole panel for the words.
#
# Snappy Animated's palette, fonts, header and stick settings, with the
# middle of the screen given to the lyrics of the track that is playing,
# over its blurred cover. The line being sung sits in the middle in the
# ink colour, the others are dimmer, and the block eases from one line to
# the next as the song goes. Long lines wrap.
#
# Lyrics come from <track>.lrc or <track>.txt next to the track, or from
# its tags (Settings > Playback > Lyrics chooses which first). Lyrics
# without times scroll at an even pace through the track. See
# docs/mods/lyrics.md.
#
# Characters the GeistMono faces do not have - Japanese, Chinese, Korean -
# are drawn from the fallback font (Theme Settings > Fallback Font,
# GNU Unifont from the fonts pack by default).
#
wps: /.rockbox/wps/SnappyLyrics.wps
sbs: /.rockbox/wps/SnappyLyrics.sbs
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
show icons: on
backdrop: -
ui viewport: -
filetype colours: -
statusbar: top
font: /.rockbox/fonts/44-GeistMono-SemiBold.fnt
#
# --- palette, from Monolith ------------------------------------------
#
# Unchanged from Snappy V2. The accent is what the chase and the pulse are
# drawn in, so changing the line selector colour here changes them too.
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
scrollbar: off
#
# --- the stick -------------------------------------------------------
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
