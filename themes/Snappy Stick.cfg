#
# Snappy Stick - Chris Soffke's Snappy, with the stick driving it.
#
# This is the one to use. The earlier themes here were visual studies
# layered on top of whatever was already loaded, which meant applying Snappy
# and then one of those in that order and hoping the second one only
# overwrote what it meant to. This file is the whole thing: Snappy's
# colours, fonts, icons, status bar and now playing screen, with the stick's
# own settings folded in, so one selection lands the look and the input
# model together.
#
# It needs Snappy's assets on the card (fonts/44-KodeMono-SemiBold.fnt,
# icons/Snappy.bmp, wps/Snappy.*). They ship with Snappy; this theme does
# not duplicate them.
#
# One thing changes from Snappy's own instructions: it asks for "point"
# touch mode, because its on-screen prev/play/next buttons and seek band are
# touch regions. Here the stick owns the panel instead, so those regions
# never fire - they stay as decoration, and the physical keys do that job on
# every screen anyway. Nothing else about the skin depends on point mode.
#
wps: /.rockbox/wps/Snappy.wps
sbs: /.rockbox/wps/Snappy.sbs
foreground color: 291400
background color: ff794a
font: /.rockbox/fonts/44-KodeMono-SemiBold.fnt
iconset: /.rockbox/icons/Snappy.bmp
viewers iconset: /.rockbox/icons/Snappy_viewer.bmp
backdrop: -
show icons: on
filetype colours: -
scrollbar: right
scrollbar width: 16
selector type: bar (color)
statusbar: top
line selector text color: 291400
line selector end color: b55931
line selector start color: b55931
ui viewport: -
#
# The stick. Four ways, full panel, and the edge light for the overlay -
# Snappy's screen is busy enough without a rose drawn over it.
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: on
stick dial lists: off
