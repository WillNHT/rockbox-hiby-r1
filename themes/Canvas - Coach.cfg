#
# Canvas - Coach
#
# The openness study's own design, as close as a Rockbox theme can get.
# Palette, proportions and HUD geometry are the prototype's, taken out of
# the bundle in the repository root rather than eyeballed:
#
#   ground  101113    ink     ECEAE6    accent  8FD6B3
#   rule    23262A    dim ink 8A8F93    cap     1B1E21
#
# The HUD is drawn to the study's measurements - a 300 px panel centred on
# the press, rings at 14, 40 and 70 px, a 104 px cap travelling 70 px, a
# readout pill 42 px down, 6x120 px edge bars at half height - and through
# the Canvas engine, so the rings and the cap are antialiased and the cap
# has a soft shadow under it.
#
# Coach is the most open level: the panel is filled, the four directions
# are named around its edge, and the cap carries the word for what the
# gesture means with the rate under it.
#
foreground color: ECEAE6
background color: 101113
line selector text color: 101113
line selector start color: 8FD6B3
line selector end color: 8FD6B3
selector type: bar (color)
statusbar: top
scrollbar: right
scrollbar width: 5
show icons: on
font: /.rockbox/fonts/18-Manrope-Medium.fnt
backdrop: -
filetype colours: -
ui viewport: -
#
# Those three colours are not decoration. A .cfg theme can only set
# settings, so foreground, background and line selector are the whole
# channel a theme has to the overlay: the HUD reads them as its ink,
# ground and accent.
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: canvas
stick edge swipe: on
stick dial wps: on
stick dial lists: on
#
# The study's three motion profiles are not settings - scroll feel lives
# in /.rockbox/stick.cfg, which is global and yours - so they are written
# down rather than applied, in this engine's units. Coach pairs with the
# gentle end:
#
#   gentle    scrollPx 170   accelMaxQ8 384   sustainVmax 30
#   standard  scrollPx 140   accelMaxQ8 512   sustainVmax 45
#   fast      scrollPx 110   accelMaxQ8 768   sustainVmax 64
#
