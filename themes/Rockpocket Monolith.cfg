#
# Rockpocket Monolith - skin 2a from the openness study.
#
# "Deletes the status bar, drops row subtitles, runs big rows in a display
# face." The stick draws no widget at all: the screen edge nearest the
# direction of travel lights in proportion to the rate, and the list
# carries the rest. For a thumb that already knows the four ways.
#
# Visual only: identical engine, identical bindings, identical feel.
#
background color: 0C0D0E
foreground color: F4F2EE
line selector start color: D9E021
line selector end color: D9E021
line selector text color: 0C0D0E
selector type: bar (inverse)
statusbar: off
scrollbar: off
backdrop: -
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: off
stick dial lists: off
