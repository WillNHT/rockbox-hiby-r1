#
# Canvas - Hardware
#
# The study's most closed level: no HUD under the thumb at all. Instead a
# control plate at the bottom of the screen, in the same place every time,
# with a cap that rides it - the study drew it as a gutter and argued that
# a control which is always in one place stops being an overlay and starts
# being part of the device.
#
# Same palette and type as the other two Canvas themes. The trade is real:
# the plate costs 150 px of list, and the gesture still works anywhere on
# the panel, so the plate is a readout of a gesture rather than the place
# to make one.
#
foreground color: ECEAE6
background color: 101113
line selector text color: 101113
line selector start color: 8FD6B3
line selector end color: 8FD6B3
selector type: bar (color)
statusbar: top
scrollbar: right
scrollbar width: 5
show icons: on
font: /.rockbox/fonts/18-Manrope-Medium.fnt
backdrop: -
filetype colours: -
ui viewport: -
#
# Those three colours are not decoration. A .cfg theme can only set
# settings, so foreground, background and line selector are the whole
# channel a theme has to the overlay: the HUD reads them as its ink,
# ground and accent.
#
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: plate
stick edge swipe: on
stick dial wps: on
stick dial lists: off
#
# The study's three motion profiles are not settings - scroll feel lives
# in /.rockbox/stick.cfg, which is global and yours - so they are written
# down rather than applied, in this engine's units. Coach pairs with the
# gentle end:
#
#   gentle    scrollPx 170   accelMaxQ8 384   sustainVmax 30
#   standard  scrollPx 140   accelMaxQ8 512   sustainVmax 45
#   fast      scrollPx 110   accelMaxQ8 768   sustainVmax 64
#
