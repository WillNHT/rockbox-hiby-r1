#
# Rockpocket Quiet - skin 2c from the openness study: permission to draw
# nothing.
#
# Paper-white, big type, no status bar, no scrollbar, and no stick chrome
# beyond an edge light. The study is explicit that this is "not a
# shippable default" - it is here to prove the engine survives a skin
# that draws nothing.
#
# Visual only: identical engine, identical bindings, identical feel.
#
background color: F4F2EC
foreground color: 1A1C1E
line selector start color: 2F6D55
line selector end color: 2F6D55
line selector text color: F4F2EC
selector type: bar (inverse)
statusbar: off
scrollbar: off
backdrop: -
touchscreen mode: stick
stick zone: fullscreen
stick sectors: 4
stick rotation: 0
stick preset: 4-way
stick arm window: 110
stick overlay: on
stick overlay style: edges
stick dial wps: off
stick dial lists: off
