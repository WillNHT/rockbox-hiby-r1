# Rockpocket Stick - example binding table.
#
# Copy to /.rockbox/stick.cfg and set
#   Settings -> General Settings -> Display -> Touchscreen Settings
#     -> Rockpocket Stick -> Binding Table -> Custom
#
# Anything you leave out keeps whatever value it already had. Anything out of
# range is replaced by the firmware default and logged, rather than refusing
# to start.
#
# This example is the "zone study" arrangement from the design set: six
# sectors over a bottom-half plate, with the status bar dead, and a work zone
# covering the whole screen so a thumb that wanders never cancels by accident.

# Sector 0 points up; sectors run clockwise from there.
sectors 6
rotation 0

# Fired on release when the thumb never left the detent radius.
centre playPause

bind 0 scrollUp
bind 1 select
bind 2 next
bind 3 scrollDown
bind 4 prev
bind 5 back

# Zones are "box <left> <top> <width> <height>" or "circle <cx> <cy> <radius>"
# in display pixels. Up to four dead zones may be listed.
arm  box 0 400 480 400
work box 0 0 480 800
dead box 0 0 480 34

# Timings and radii. degPerDetent below 8 sits under the panel's angular
# noise at small radii and produces phantom steps, so it is rejected.
armMs 110
degPerDetent 14
detentPx 18
travelPx 78
dialMinPx 34
