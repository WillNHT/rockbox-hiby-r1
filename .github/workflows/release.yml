name: HiBy R1 release

# Produces files that go straight onto the player, attached to a GitHub
# Release instead of buried in a double-zipped Actions artifact.
#
#   push to master       -> the next semantic version, worked out from the
#                           Conventional Commit messages (and PR titles)
#                           since the last vX.Y.Z tag - see
#                           tools/release/next-version.sh - is tagged and
#                           released
#   push a tag v*        -> that tag is released
#   manual dispatch      -> the given tag, or the next version if blank
#
# The version is baked into the firmware (make VERSION=...), so the
# player's System > Rockbox Info shows the release it came from.
on:
  push:
    tags: ['v*']
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (blank = next semantic version)'
        required: false
        type: string

permissions:
  contents: write

# One release at a time, in order: two merges in quick succession must not
# both compute the same "next" version, and a queued run must not be
# cancelled, or its changes would never be released under their own number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    name: Pick version
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      bump: ${{ steps.pick.outputs.bump }}
      reflash: ${{ steps.reflash.outputs.reflash }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Pick
      id: pick
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "bump=manual" >> $GITHUB_OUTPUT
        elif [ -n "$INPUT_TAG" ]; then
          echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          echo "bump=manual" >> $GITHUB_OUTPUT
        else
          sh tools/release/next-version.sh | tee next.txt
          . ./next.txt
          echo "tag=$next" >> $GITHUB_OUTPUT
          echo "bump=$bump" >> $GITHUB_OUTPUT
          echo "### $previous -> $next ($bump)" >> $GITHUB_STEP_SUMMARY
        fi
    # The bootloader only reaches the player through r1.upt, flashed by
    # hand, so the notes must say when it changed since the last release.
    - name: Bootloader changed?
      id: reflash
      run: |
        prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
        if [ -z "$prev" ] || ! git diff --quiet "$prev" "$GITHUB_SHA" -- bootloader tools/r1_patcher; then
          echo "reflash=yes" >> $GITHUB_OUTPUT
        else
          echo "reflash=no" >> $GITHUB_OUTPUT
        fi

  build:
    needs: version
    if: needs.version.outputs.bump != 'none'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: firmware
            type: N
          - name: bootloader
            type: B
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # version string comes from git describe

    - name: Install dependencies
      timeout-minutes: 15
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y automake bison build-essential ccache flex libc6-dev libgmp3-dev libmpfr-dev \
        libsdl1.2-dev libtool-bin texinfo zip gawk wget libmpc-dev gettext gtk-doc-tools

    - name: root suid tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - name: Restore toolchain
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: /tmp/local
        # Same key as build.yml, so the two workflows share the toolchain.
        key: ${{ runner.os }}-toolchain-y-${{ hashFiles('tools/rockboxdev.sh') }}

    - name: Build toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        cd tools
        chmod +x rockboxdev.sh
        sudo ./rockboxdev.sh --target=y --prefix=/tmp/local

    - name: Save toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /tmp/local
        key: ${{ runner.os }}-toolchain-y-${{ hashFiles('tools/rockboxdev.sh') }}

    - name: Build
      env:
        VERSION: ${{ needs.version.outputs.tag }}
      run: |
        export PATH=/tmp/local/bin:$PATH
        mkdir build && cd build
        ../tools/configure --target=hibyr1 --type=${{ matrix.type }}
        make -j$(nproc) VERSION="$VERSION"
        mkdir ../out
        if [ "${{ matrix.type }}" = B ]; then
          cp bootloader.r1 ../out/
        else
          # fontzip first: with rockbox.zip already present, its NODEPS rule
          # would consider the target up to date and write nothing.
          make fontzip VERSION="$VERSION"
          make zip VERSION="$VERSION"
          # curl for the updater (tools/rbcurl)
          sudo chmod u-s /bin/tar
          sh ../tools/rbcurl/build.sh r1 /tmp/rbcurl-out
          mkdir -p /tmp/rbcurl-zip/.rockbox/lib
          cp /tmp/rbcurl-out/curl /tmp/rbcurl-out/cacert.pem /tmp/rbcurl-zip/.rockbox/lib/
          (cd /tmp/rbcurl-zip && zip -qr "$OLDPWD/rockbox.zip" .rockbox)
          cp rockbox.zip ../out/rockbox-hibyr1.zip
          cp rockbox-fonts.zip ../out/rockbox-hibyr1-fonts.zip
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: out/*
        if-no-files-found: error

  themes:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    name: Package themes
    steps:
    - uses: actions/checkout@v7
    # The fork's themes live outside the build's zip; lay them out as they
    # sit on the card so the archive unzips over the player's root.
    - name: Package
      run: |
        mkdir -p pkg/.rockbox/themes pkg/.rockbox/wps pkg/.rockbox/fonts pkg/.rockbox/icons out
        cp themes/*.cfg pkg/.rockbox/themes/
        cp -r themes/wps/. pkg/.rockbox/wps/
        cp -r themes/fonts/. pkg/.rockbox/fonts/
        cp -r themes/icons/. pkg/.rockbox/icons/
        (cd pkg && zip -r ../out/rockbox-hibyr1-themes.zip .rockbox)
    - uses: actions/upload-artifact@v7
      with:
        name: themes
        path: out/*

  # Colour emoji for text (apps/emoji.c): Noto Emoji's pictures, packed
  # by tools/emojipack.py. Only the png/72 folder of the pinned release is
  # fetched.
  emoji:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    name: Package emoji
    env:
      NOTO_EMOJI_TAG: v2.051
    steps:
    - uses: actions/checkout@v7
    - name: Fetch Noto Emoji pictures
      run: |
        git clone --quiet --depth 1 --branch "$NOTO_EMOJI_TAG" \
          --filter=blob:none --sparse \
          https://github.com/googlefonts/noto-emoji.git noto
        git -C noto sparse-checkout set png/72
    - name: Pack
      run: |
        pip install --quiet pillow
        mkdir -p pkg/.rockbox/emoji out
        python3 tools/emojipack.py --size 36 noto/png/72 pkg/.rockbox/emoji/emoji.rbe
        cp noto/LICENSE pkg/.rockbox/emoji/LICENSE-noto-emoji.txt
        echo "Noto Emoji $NOTO_EMOJI_TAG, https://github.com/googlefonts/noto-emoji" \
          > pkg/.rockbox/emoji/SOURCE.txt
        (cd pkg && zip -qr ../out/rockbox-hibyr1-emoji.zip .rockbox)
    - uses: actions/upload-artifact@v7
      with:
        name: emoji
        path: out/*

  # The video decoder: FFmpeg and libwebp behind apps/video/rbvideo.h,
  # cross-compiled for the player and packed as one shared object. It is
  # its own download because it is several megabytes and only the video
  # features need it (Settings > Video). Runs after build, which saves the
  # toolchain: this job has none of the packages needed to build its own.
  video:
    needs: [version, build]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    name: Package video decoder
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      timeout-minutes: 15
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y automake build-essential libtool-bin \
          pkg-config texinfo wget zip zlib1g-dev
    - name: Restore toolchain
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: /tmp/local
        key: ${{ runner.os }}-toolchain-y-${{ hashFiles('tools/rockboxdev.sh') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-y-
    - name: Build toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        cd tools
        chmod +x rockboxdev.sh
        sudo ./rockboxdev.sh --target=y --prefix=/tmp/local
    - name: Cache the decoder's own build
      id: rbvcache
      uses: actions/cache@v6
      with:
        path: /tmp/rbvideo-out
        key: ${{ runner.os }}-rbvideo-${{ hashFiles('tools/rbvideo/build.sh', 'tools/rbvideo/rbvideo.c', 'apps/video/rbvideo.h') }}
    - name: Build librbvideo.so
      if: steps.rbvcache.outputs.cache-hit != 'true'
      run: |
        export PATH=/tmp/local/bin:$PATH
        sh tools/rbvideo/build.sh r1 /tmp/rbvideo-out
    - name: Pack
      run: |
        mkdir -p pkg/.rockbox/lib out
        cp /tmp/rbvideo-out/librbvideo.so pkg/.rockbox/lib/
        cp tools/rbvideo/README.md pkg/.rockbox/lib/README-librbvideo.txt
        (cd pkg && zip -qr ../out/rockbox-hibyr1-video.zip .rockbox)
        ls -l out
    - uses: actions/upload-artifact@v7
      with:
        name: video
        path: out/*
        if-no-files-found: error

  # A stock HiBy update with this fork's bootloader injected: flash it once
  # through the player's own updater to get the Rockbox boot option.
  patched-firmware:
    needs: build
    runs-on: ubuntu-latest
    name: Patch stock firmware
    continue-on-error: true  # the stock image is third-party; never block a release on it
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: bootloader
    - name: Patch
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y p7zip-full squashfs-tools genisoimage coreutils
        curl -fL -o r1.upt "https://github.com/bidhata/Hiby-R1-Mod/releases/download/file-limit/r1.upt"
        chmod +x tools/r1_patcher/r1_patcher.sh
        sudo ./tools/r1_patcher/r1_patcher.sh r1.upt bootloader.r1
        # r1.upt is the name the player's updater looks for.
        mkdir out && sudo cp r1_rb.upt out/r1.upt && sudo chown -R "$USER" out
    - uses: actions/upload-artifact@v7
      with:
        name: patched-firmware
        path: out/*

  # Everything the card needs in one archive: unzip it over the root of
  # the SD card and the player has a complete, themed Rockbox with no
  # other downloads. It is the only zip the release publishes.
  bundle:
    needs: [version, build, themes, emoji, video]
    runs-on: ubuntu-latest
    name: Bundle SD card
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: parts
        merge-multiple: true
    - name: Bundle
      env:
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        mkdir -p card out
        # Themes last, so their fonts and .cfg files win over anything of
        # the same name in the base install.
        for z in rockbox-hibyr1.zip rockbox-hibyr1-fonts.zip rockbox-hibyr1-themes.zip rockbox-hibyr1-emoji.zip rockbox-hibyr1-video.zip; do
          unzip -oq "parts/$z" -d card
        done
        echo "$TAG" > card/.rockbox/fork-version.txt
        (cd card && zip -qr "../out/rockbox-hibyr1-$TAG-sdcard.zip" .rockbox)
        ls -l out
    - uses: actions/upload-artifact@v7
      with:
        name: rockbox-hibyr1-${{ needs.version.outputs.tag }}-sdcard
        path: out/*
        if-no-files-found: error

  publish:
    needs: [version, build, themes, emoji, video, bundle, patched-firmware]
    if: always() && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    name: Publish release
    steps:
    # Only the card bundle, the bootloader and r1.upt: the per-part zips
    # are build intermediates already inside the bundle.
    - uses: actions/download-artifact@v7
      with:
        name: rockbox-hibyr1-${{ needs.version.outputs.tag }}-sdcard
        path: dist
    - uses: actions/download-artifact@v7
      with:
        name: bootloader
        path: dist
    - uses: actions/download-artifact@v7
      continue-on-error: true  # patched-firmware may have failed
      with:
        name: patched-firmware
        path: dist

    - name: Checksums
      run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

    - name: Write notes
      env:
        TAG: ${{ needs.version.outputs.tag }}
        REFLASH: ${{ needs.version.outputs.reflash }}
      run: |
        if [ "$REFLASH" = yes ]; then
          cat > notes.md <<EOF
        > [!IMPORTANT]
        > **The bootloader changed in this release.** Copy \`r1.upt\` to the card root and run the player's firmware update, as well as updating the SD card.

        EOF
        else
          : > notes.md
        fi
        cat >> notes.md <<EOF
        Built from \`${GITHUB_SHA::10}\`.

        **Install or upgrade:** unzip \`rockbox-hibyr1-${TAG}-sdcard.zip\` over the root of the SD card. It holds the firmware, fonts, themes, emoji and the video decoder; nothing else is needed on the card.

        | File | Use |
        |---|---|
        | \`rockbox-hibyr1-${TAG}-sdcard.zip\` | Unzip to the card root. |
        | \`r1.upt\` | Stock HiBy firmware with this fork's bootloader (if present). Copy to the card root and run the player's firmware update. Needed on first install and when the notes above say the bootloader changed. |
        | \`bootloader.r1\` | The bare bootloader, for \`tools/r1_patcher\`. |

        Check downloads against \`SHA256SUMS\`.
        EOF

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        # gh creates the tag on $GITHUB_SHA when it does not exist yet. A
        # tag made with the workflow's own token starts no workflow run, so
        # this does not loop back into the tag trigger.
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md --generate-notes
        fi
